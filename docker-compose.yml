services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexsaude
      POSTGRES_USER: nexsaude
      POSTGRES_PASSWORD: nexsaude
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexsaude"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/nexsaude
      DB_USER: nexsaude
      DB_PASSWORD: nexsaude
      # IA: simulada (padrão) | ollama (gratuita, local) | claude (paga). Configure no .env da raiz.
      NEXSAUDE_IA_MODO: ${NEXSAUDE_IA_MODO:-simulada}
      NEXSAUDE_IA_TIMEOUT_SEG: ${NEXSAUDE_IA_TIMEOUT_SEG:-10}
      NEXSAUDE_IA_OLLAMA_URL: http://ollama:11434
      NEXSAUDE_IA_OLLAMA_MODELO: ${NEXSAUDE_IA_OLLAMA_MODELO:-qwen2.5:3b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  # IA local gratuita. Só sobe com: docker compose --profile ollama up --build
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
